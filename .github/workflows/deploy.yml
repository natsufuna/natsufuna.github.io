name: 日記を公開

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # 整形した日記をコミットするため
  pages: write
  id-token: write

# 投稿が続いても順番に処理する
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 音声入力の下書きを整える
        if: hashFiles('_inbox/*.md') != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm run tidy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _inbox _posts
          git commit -m "diary: 音声入力の下書きを整形"
          for i in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && break
            sleep 5
          done

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
