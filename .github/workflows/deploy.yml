name: 日記を公開

on:
  push:
    branches: [master]
    # メモ (下書き) を保存しただけなら、公開し直さない
    paths-ignore:
      - "_drafts/**"
  # 利用制限などで整形できずに残った下書きを、1日1回 (日本時間 6:17) 整形し直す
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write # 整形した日記をコミットするため
  pages: write
  id-token: write

# 投稿が続いても順番に処理する
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      # 定期実行で整形待ちがなければ、ここで終わる
      - id: pending
        run: |
          if ls _inbox/*.md >/dev/null 2>&1; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi

      - if: github.event_name != 'schedule' || steps.pending.outputs.any == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: github.event_name != 'schedule' || steps.pending.outputs.any == 'true'
        run: npm ci

      - name: 音声入力の下書きを整える
        id: tidy
        if: steps.pending.outputs.any == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          # Claude のサブスクリプションで整形するときだけ Claude Code を入れる
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then npm install -g @anthropic-ai/claude-code; fi
          npm run tidy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _inbox _posts
          # 全部あとで整形し直す場合は、コミットするものがない
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "diary: 音声入力の下書きを整形"
          for i in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 定期実行では、整形して公開できるものが出たときだけ公開し直す
      - id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.tidy.outputs.changed }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.decide.outputs.publish == 'true'
        run: npm run build

      - if: steps.decide.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
